    format: .windsurfrules (markdown/text in repo root)
    supported: yes
    notes: Windsurf reads .windsurfrules similarly to Cursor's .cursorrules
  commands:
    format: none_known
    supported: unknown
    notes: Custom Flows API may support command-like interactions; investigate
  hooks:
    pre_tool: no
    post_tool: no
    session_stop: no
    notes: No hook event API documented; Windsurf Flows may provide partial equivalent
  mcp_servers:
    supported: yes
    format: unknown (likely similar to .mcp.json)
