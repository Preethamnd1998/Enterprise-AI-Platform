# Windsurf — File Map (STUB)
# adapters/windsurf/file-map.yml — source → destination mapping for when adapter is activated

platform: windsurf
status: stub

install_targets:
  - source: shared/contract.md
    destination: .windsurfrules
    method: kernel_only
    create_if_absent: true
    overwrite: true

  - source: shared/standards/
    destination: .windsurf/ai-platform/standards/
    method: copy_tree
    create_if_absent: true
    overwrite: true

  - source: shared/rules/
    destination: .windsurf/ai-platform/rules/
    method: copy_tree
    create_if_absent: true
    overwrite: true

  - source: shared/company-profile.md
    destination: .windsurf/ai-platform/company-profile.md
    method: copy_file
    create_if_absent: true
    overwrite: false

  - source: shared/templates/ai/
    destination: .ai/
    method: copy_tree
    create_if_absent: true
    overwrite: false

version_stamp:
  destination: .windsurf/.platform-version.json
