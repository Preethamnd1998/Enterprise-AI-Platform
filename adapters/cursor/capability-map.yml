# Cursor — Capability Map (STUB)
# adapters/cursor/capability-map.yml — assessed 2026-07-07
# Source: public Cursor docs + community reports

platform: cursor
status: stub
evidence_gate: cursorrules_api_confirmed OR lifetrenz_adoption_confirmed

capabilities:
  config_injection:
    format: .cursorrules (markdown/text in repo root)
    supported: yes
    notes: Cursor reads .cursorrules from repo root; similar to CLAUDE.md
  commands:
    format: none_known
    supported: unknown
    notes: No documented slash-command or custom-prompt API as of 2026-07; investigate
  hooks:
    pre_tool: no
    post_tool: no
    session_stop: no
    notes: No hook event API documented
  mcp_servers:
    supported: yes
    format: .cursor/mcp.json (similar to .mcp.json)
    notes: Cursor supports MCP as of v0.43+; allowlist syntax TBD
  per_repo_config:
    supported: yes
    via: .cursorrules in repo root

gaps_vs_claude_code:
  - No hook API → no audit.js equivalent
  - No slash commands → no /bug-fix, /migration, etc. (workaround: embed in .cursorrules)
  - No subagent control → subagent rules unenforceable
