# Cursor — File Map (STUB)
# adapters/cursor/file-map.yml — source → destination mapping for when adapter is activated
# Installer will use this map to copy files into consuming repos

platform: cursor
status: stub

install_targets:
  - source: shared/contract.md   # kernel section only
    destination: .cursorrules
    method: kernel_only          # extract lines between kernel:start/end markers
    create_if_absent: true
    overwrite: true

  - source: shared/standards/
    destination: .cursor/ai-platform/standards/
    method: copy_tree
    create_if_absent: true
    overwrite: true

  - source: shared/rules/
    destination: .cursor/ai-platform/rules/
    method: copy_tree
    create_if_absent: true
    overwrite: true

  - source: shared/company-profile.md
    destination: .cursor/ai-platform/company-profile.md
    method: copy_file
    create_if_absent: true
    overwrite: false             # preserve company customisations

  - source: shared/templates/ai/
    destination: .ai/
    method: copy_tree
    create_if_absent: true
    overwrite: false             # preserve per-repo customisations

version_stamp:
  destination: .cursor/.platform-version.json
