# Roo Code — Capability Map (STUB)
# adapters/roo-code/capability-map.yml — assessed 2026-07-07

platform: roo-code
status: stub
evidence_gate: roo_rules_api_confirmed OR lifetrenz_adoption_confirmed

capabilities:
  config_injection:
    format: .roo/rules/*.md (per-mode rules files)
    supported: yes
    notes: Roo Code supports per-mode rules; maps well to our standards/rules model
  commands:
    format: custom_modes (Roo-specific)
    supported: yes
    notes: Roo Code custom modes can define role + instructions — viable command equivalent
  hooks:
    pre_tool: no
    post_tool: no
    session_stop: no
    notes: No documented hook event API
  mcp_servers:
    supported: yes
    format: user-scoped config; per-repo TBD
    notes: MCP supported; per-repo allowlist enforcement mechanism TBD
  per_repo_config:
    supported: yes
    via: .roo/ directory in repo root

gaps_vs_claude_code:
  - No hook API → no audit.js
  - Custom modes are closest to our command model — evaluate for full command mapping
  - Roo Code has strongest rules injection story among Cline-family tools
