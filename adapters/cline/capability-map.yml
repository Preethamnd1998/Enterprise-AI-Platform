# Cline — Capability Map (STUB)
# adapters/cline/capability-map.yml — assessed 2026-07-07

platform: cline
status: stub
evidence_gate: rules_injection_confirmed OR lifetrenz_adoption_confirmed

capabilities:
  config_injection:
    format: .clinerules (markdown file — analogous to .cursorrules)
    supported: yes
    notes: Cline reads .clinerules from repo root as additional system context
  commands:
    format: none_known
    supported: unknown
    notes: Cline is autonomous-agent mode; slash commands may not apply
  hooks:
    pre_tool: no
    post_tool: no
    session_stop: no
    notes: No documented hook API; Cline has its own approval/auto modes
  mcp_servers:
    supported: yes
    format: cline_mcp_settings.json (user-scoped)
    notes: Per-repo MCP allowlist enforcement TBD
  per_repo_config:
    supported: yes
    via: .clinerules in repo root

gaps_vs_claude_code:
  - Cline is autonomous-agent model → approval gate behavior may conflict with contract §14
  - No hook API → no audit.js
  - MCP per-repo allowlist requires investigation
