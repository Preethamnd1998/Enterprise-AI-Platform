# Cline — File Map (STUB)
# adapters/cline/file-map.yml — source → destination mapping for when adapter is activated

platform: cline
status: stub

install_targets:
  - source: shared/contract.md
    destination: .clinerules
    method: kernel_only
    create_if_absent: true
    overwrite: true

  - source: shared/standards/
    destination: .cline/ai-platform/standards/
    method: copy_tree
    create_if_absent: true
    overwrite: true

  - source: shared/rules/
    destination: .cline/ai-platform/rules/
    method: copy_tree
    create_if_absent: true
    overwrite: true

  - source: shared/company-profile.md
    destination: .cline/ai-platform/company-profile.md
    method: copy_file
    create_if_absent: true
    overwrite: false

  - source: shared/templates/ai/
    destination: .ai/
    method: copy_tree
    create_if_absent: true
    overwrite: false

version_stamp:
  destination: .cline/.platform-version.json
