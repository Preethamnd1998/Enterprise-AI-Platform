# adapters/opencode/capability-map.yml
# Capability matrix for OpenCode adapter.
# SP-03 result: no hook/event API → observability unsupported.
# SP-04 result: inline + AGENTS.md approach for commands.
# SP-06: OC MCP permission granularity — server-level only (same as Copilot).

version: "4.0"
adapter: opencode
platform: "OpenCode (Desktop + CLI)"
updated: "2026-07-07"

capabilities:

  # ── Commands ──────────────────────────────────────────────────────────────
  - id: cap-01
    name: "/bug-fix command"
    status: supported
    notes: ".opencode/command/bug-fix.md shell"

  - id: cap-02
    name: "/migration command"
    status: supported
    notes: ".opencode/command/migration.md shell"

  - id: cap-03
    name: "/new-development command"
    status: supported
    notes: ".opencode/command/new-development.md shell"

  - id: cap-04
    name: "/data-correction command"
    status: supported
    notes: ".opencode/command/data-correction.md shell"

  - id: cap-05
    name: "/ui-design-update command"
    status: supported
    notes: ".opencode/command/ui-design-update.md shell"

  - id: cap-06
    name: "/test command"
    status: supported
    notes: ".opencode/command/test.md shell (Phase C)"

  - id: cap-07
    name: "/prompt-audit command"
    status: supported
    notes: ".opencode/command/prompt-audit.md shell (Phase D). Depends on shared/prompts/ being copied by file-map.yml (fixed in v4.3.0 hardening pass)."

  # ── Contract ──────────────────────────────────────────────────────────────
  - id: cap-08
    name: "Shared contract injection"
    status: degraded
    notes: "Contract injected into AGENTS.md between markers. OC reads AGENTS.md at session start."

  - id: cap-09
    name: "Contract hash-check"
    status: unsupported
    notes: "SP-03: no PreToolUse hook in OpenCode"

  # ── MCP ───────────────────────────────────────────────────────────────────
  - id: cap-10
    name: "MCP read tools"
    status: supported
    notes: "MCP configured via opencode.json mcpServers block"

  - id: cap-11
    name: "MCP per-tool allowlist"
    status: unsupported
    notes: "SP-06: OC MCP is server-level only. Read-only PATs are the control mechanism."

  - id: cap-12
    name: "MCP write-tool deny"
    status: degraded
    notes: "Controlled by PAT scope, not platform allowlist. Same limitation as Copilot (SP-08)."

  # ── Sessions / Memory ─────────────────────────────────────────────────────
  - id: cap-13
    name: "Session memory"
    status: unsupported
    notes: "OC has no persistent session state across invocations."

  - id: cap-14
    name: "Subagent orchestration"
    status: unsupported
    notes: "No native subagent API in OpenCode."

  # ── Observability ─────────────────────────────────────────────────────────
  - id: cap-15
    name: "Audit log"
    status: unsupported
    notes: "SP-03: OC has no hook/event API. No session-end event. Audit = Claude Code only."

  # ── Installer ─────────────────────────────────────────────────────────────
  - id: cap-16
    name: "Idempotent installer"
    status: supported
    notes: "adapters/opencode/install.ps1 copies shared/ to .opencode/ai-platform/"

  - id: cap-17
    name: "Feature flags"
    status: supported
    notes: "Installer writes .opencode/ai-platform/.platform-version.json"
