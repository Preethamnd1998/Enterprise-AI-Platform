# adapters/copilot/file-map.yml
# Maps platform source files → consuming repo targets for GitHub Copilot adapter.
# Source paths are relative to the platform repo root (shared/).
# Target paths are relative to the consuming repo root.
# Installer (install.ps1) reads this file and copies/injects accordingly.
# SP-05 decision: copy approach — shared/ is copied to .github/ai-platform/ in consuming repos.

version: "3.2"
adapter: copilot

entries:

  # ── Shared contract → copilot-instructions.md reference + copied file ─────
  - source: "shared/contract.md"
    target: ".github/ai-platform/shared/contract.md"
    action: copy
    notes: "Copied for prompt files to reference. Never injected directly into copilot-instructions.md."

  # ── Commands (all files from shared/commands/) ─────────────────────────────
  # Copies the full command source, including migration-intelligence.md
  # (lazy-loaded by /migration only — not a standalone chatmode/prompt) and
  # test.md (no Copilot shell yet — see capability-map.yml cap-06).
  - source: "shared/commands/"
    target: ".github/ai-platform/shared/commands/"
    action: copy_directory

  # ── Prompt framework (referenced by prompt-audit.prompt.md) ────────────────
  - source: "shared/prompts/"
    target: ".github/ai-platform/shared/prompts/"
    action: copy_directory

  # ── Standards ─────────────────────────────────────────────────────────────
  - source: "shared/standards/"
    target: ".github/ai-platform/standards/"
    action: copy_directory
    notes: "Lazy-loaded by commands. All layer stubs copied."

  # ── Copilot prompt shells ──────────────────────────────────────────────────
  - source: "adapters/copilot/prompts/"
    target: ".github/prompts/"
    action: copy_directory
    notes: "Generated by tools/generate-copilot.ps1 from registry.yml"

  # ── Copilot chatmode shells ────────────────────────────────────────────────
  - source: "adapters/copilot/chatmodes/"
    target: ".github/chatmodes/"
    action: copy_directory

  # ── Copilot instructions ───────────────────────────────────────────────────
  - source: "adapters/copilot/copilot-instructions.md"
    target: ".github/copilot-instructions.md"
    action: marker_inject
    markers:
      start: "<!-- enterprise-ai-platform:contract:start -->"
      end:   "<!-- enterprise-ai-platform:contract:end -->"
    notes: "Injected between markers; content outside markers is preserved."

  # ── Platform version ──────────────────────────────────────────────────────
  - source: "_generated_"
    target: ".github/ai-platform/.platform-version.json"
    action: generate
    notes: "Written by installer engine with version, adapter=copilot, features{}"
