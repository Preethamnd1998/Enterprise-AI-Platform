stages: [validate, release]

validate:
  stage: validate
  image: node:20-alpine
  script:
    - sh ci/validate.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

release:
  stage: release
  image: alpine:latest
  script:
    - sh ci/release-check.sh
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
